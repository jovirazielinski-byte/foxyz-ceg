<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color"
        content="#D7E5FA">

  <title>FOXYZ CEG</title>

  <link rel="manifest"
        href="./manifest.json">

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #D7E5FA;
      font-family: "Nunito", sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 40px 25px;
      text-align: center;
    }

    .logo {
      width: 190px;
      height: 190px;
      object-fit: contain;

      display: block;
      margin: 0 auto 18px;
    }

    h1 {
      margin: 0 0 30px;

      font-family: "Comfortaa", sans-serif;
      font-size: 30px;
      font-weight: 700;

      color: #18375d;
      letter-spacing: 0.5px;
    }

    .button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 210px;
      padding: 14px 28px;

      border-radius: 16px;

      background: #18375d;
      color: white;

      font-family: "Nunito", sans-serif;
      font-size: 16px;
      font-weight: 800;

      text-decoration: none;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .button:active {
      transform: scale(0.97);
    }

  </style>

</head>

<body>

  <div class="container">

    <img
      class="logo"
      src="https://res.cloudinary.com/hxdbktes/image/upload/v1790865414/foxyzcegraposinha_944x944png.png"
      alt="FOXYZ CEG"
    >

    <h1>Foxyz CEG</h1>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbzndQHSfixIYyeEBrW_PrmZVQuagMGDHbMr7mrICQZ_eUZmEzUlalkk_h4-VvrfmkRf/exec"
    >
      ENTRAR
    </a>

  </div>

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function () {

        navigator.serviceWorker.register("./sw.js");

      });

    }

  </script>

</body>

</html>
